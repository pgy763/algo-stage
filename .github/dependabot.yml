version: 2
updates:
  # 前端依赖：每周看一眼，别让 Vue / Vite 落后太多
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # vue-router 5 是跨大版本：npm ci 直接解析失败，属于要单独开分支评估的迁移，
      # 别让它在每周的自动 PR 里反复出现。真要升的时候手动做。
      - dependency-name: 'vue-router'
        update-types: ['version-update:semver-major']

  # Actions 本身也会过期
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(ci)'